<style>
  :root {
    color-scheme: light dark;
    --fondo: #f4f5f7;
    --tarjeta: #ffffff;
    --texto: #1b1d21;
    --tenue: #5c6270;
    --borde: #e3e5ea;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fondo: #16181d;
      --tarjeta: #1f2229;
      --texto: #eceef2;
      --tenue: #a0a6b3;
      --borde: #2c3038;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: var(--fondo);
    color: var(--texto);
    font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .tarjeta {
    max-width: 30rem;
    width: 100%;
    padding: 40px 32px;
    text-align: center;
    background: var(--tarjeta);
    border: 1px solid var(--borde);
    border-radius: 14px;
  }
  img {
    width: 100%;
    max-width: 15rem;
    height: auto;
    margin-bottom: 24px;
    /* El SVG lleva su propio fondo blanco a sangre: en tema claro se funde con
       la tarjeta y en oscuro queda como una placa con las esquinas redondeadas. */
    background: #fff;
    border-radius: 10px;
  }
  h1 { margin: 0 0 12px; font-size: 1.375rem; line-height: 1.3; font-weight: 600; }
  p { margin: 0; color: var(--tenue); }
  .pie { margin-top: 24px; font-size: .8125rem; color: var(--tenue); }
</style>
</head>
<body>
  <main class="tarjeta">
    <img src="/__mantenimiento-logo.svg" width="2048" height="1529"
         alt="">
    <h1>Esta web s&oacute;lo est&aacute; disponible durante el horario escolar</h1>
    <p>Vuelve a intentarlo m&aacute;s tarde.</p>
    <p class="pie">I.E.S. Santiago Ap&oacute;stol</p>
  </main>
</body>
