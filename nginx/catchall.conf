# Servidor por defecto: absorbe todo lo que llega a la IP publica sin un SNI o
# un Host que case con un server_name real, y no responde nada (444).
#
# Por que hace falta (diagnosticado el 2026-09-03):
#   - En el puerto 80 el default_server lo tenia sites-available/almacen_fp con
#     `server_name _`, asi que cualquier peticion a la IP desnuda entraba a
#     Django por uwsgi. Lo unico que las paraba era ALLOWED_HOSTS, o sea la
#     propia aplicacion haciendo de cortafuegos: ~3400 respuestas 400 medidas,
#     y eran de Django, no de nginx.
#   - En el puerto 443 nadie declaraba default_server, asi que nginx tomaba el
#     primer bloque `listen 443` que parseaba. Como nginx.conf incluye
#     sites-enabled/* (linea 56) ANTES del bloque de la IA (linea 60), el que
#     mandaba era el de almacen_fp: una conexion con SNI inventado recibia el
#     certificado de fp.santiagoapostol.net.
#
# fp.santiagoapostol.net no apunta aqui (resuelve a 172.23.120.210, privada),
# pero su nombre es publico via Certificate Transparency, asi que los escaneres
# lo envian como Host contra esta IP y atravesaban hasta Django: 631 peticiones
# de 35.236.175.93 llegaron, incluida una 200 en /accounts/login/.
#
# Este bloque NO toca ALLOWED_HOSTS: fp.santiagoapostol.net sigue siendo un Host
# valido para la aplicacion. Lo que se corta es el acceso por IP sin nombre.
#
# Certificado propio y autofirmado (CN=invalid): un cliente sin SNI valido debe
# encontrarse un handshake que no valida. No se reutiliza el de la IA a proposito.
server {
    listen 80  default_server;
    listen [::]:80 default_server;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_certificate     /opt/iasantiago-rag/nginx/certs/catchall.crt;
    ssl_certificate_key /opt/iasantiago-rag/nginx/certs/catchall.key;

    access_log /var/log/nginx/catchall_access.log;
    error_log  /var/log/nginx/catchall_error.log;

    # Se deja pasar el reto ACME aunque el Host no case: si algun dia se renueva
    # un certificado por HTTP-01 contra la IP, el 444 lo romperia en silencio.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 444;
    }
}
