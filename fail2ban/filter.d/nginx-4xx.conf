# Red de seguridad genérica: ráfaga de 4xx desde una misma IP.
# Umbral calibrado el 2026-09-03 sobre openwebui_access.log{,.1}: los usuarios
# reales acumulan 6 respuestas 403 y 2 401 por sesión (rotación de cookie de
# oauth2-proxy); los escáneres medidos, 12 y 275. maxretry=20 separa limpio.
[Definition]
failregex = ^<HOST> -.*"[A-Z]+ [^"]*" (?:400|401|403|404|444) 
ignoreregex = ^<HOST> -.*"[A-Z]+ /(?:api/v1/auths/|favicon\.ico|_app/)[^"]*" 
datepattern = ^[^\[]*\[({DATE})
              {^LN-BEG}
