# Sondas de escáner sobre rutas que ningún cliente legítimo pide nunca.
# Motivo: detrás de oauth2-proxy estas peticiones NO dan 404 de nginx (no
# llegan a error.log), sino un 403 de ~40 KB con la plantilla de login. El
# filtro nginx-botsearch de serie lee error.log y aquí no ve nada, así que
# hace falta uno propio sobre access.log.
[Definition]
failregex = ^<HOST> -.*"(?:GET|POST|HEAD|PUT|PATCH|DELETE|OPTIONS) [^"]*(?:\.env|/\.git/|/\.svn/|/\.aws/|/\.ssh/|wp-login|wp-admin|wp-includes|wp-content|xmlrpc\.php|phpinfo|phpmyadmin|/vendor/|/cgi-bin/|/actuator|/solr/|/telescope/|/_ignition|/_profiler|\.asp[x]?|/config\.json|/dump\.sql|/backup\.)[^"]*"
ignoreregex =
datepattern = ^[^\[]*\[({DATE})
              {^LN-BEG}
